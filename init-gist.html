<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Initialize Fuse Gist</title>
    <style>
        body {
            font-family: monospace;
            background: #1a1a1a;
            color: #fff;
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { color: #00c850; }
        button {
            background: #5865F2;
            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            margin: 20px 0;
        }
        button:hover { background: #4752C4; }
        .output {
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            white-space: pre-wrap;
        }
        .success { color: #00c850; }
        .error { color: #ff4444; }
    </style>
</head>
<body>
    <h1>🚀 Initialize Fuse User System</h1>
    <p>Click the button below to initialize the Gist file with the correct structure.</p>
    
    <button onclick="initializeGist()">Initialize Gist</button>
    
    <div id="output" class="output"></div>

    <script>
        const GIST_ID = '7f9e078242e1515e41b2c3b2e4cca2a7';
        const GIST_TOKEN = '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';

        function log(msg, type = 'info') {
            const output = document.getElementById('output');
            const span = document.createElement('div');
            span.className = type;
            span.textContent = msg;
            output.appendChild(span);
        }

        async function initializeGist() {
            document.getElementById('output').innerHTML = '';
            log('Initializing Gist...', 'info');

            try {
                // Create initial structure
                const initialData = {
                    users: [],
                    banned: []
                };

                log('Creating fuse-users.json file...', 'info');

                const response = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `token ${GIST_TOKEN}`
                    },
                    body: JSON.stringify({
                        files: {
                            'fuse-users.json': {
                                content: JSON.stringify(initialData, null, 2)
                            }
                        }
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    log('❌ Error: ' + error.message, 'error');
                    log('Full error: ' + JSON.stringify(error, null, 2), 'error');
                    return;
                }

                const result = await response.json();
                log('✅ Success! Gist initialized.', 'success');
                log('Gist URL: ' + result.html_url, 'success');
                log('\nYou can now:', 'info');
                log('1. Sign in to the dashboard', 'info');
                log('2. Open the admin panel', 'info');
                log('3. See all authorized users', 'info');

            } catch (err) {
                log('❌ Exception: ' + err.message, 'error');
                console.error(err);
            }
        }
    </script>
</body>
</html>
