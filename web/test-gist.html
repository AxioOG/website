<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gist API Test</title>
    <style>
        body {
            font-family: monospace;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        h1 { color: #00c850; }
        button {
            background: #5865F2;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            margin: 10px 5px;
        }
        button:hover { background: #4752C4; }
        .output {
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .success { color: #00c850; }
        .error { color: #ff4444; }
        .info { color: #5865F2; }
        input {
            background: #0a0a0a;
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            font-family: monospace;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>🔧 Fuse Gist API Diagnostic Tool</h1>
    <p>This tool will help diagnose why users aren't appearing in the admin panel.</p>

    <h2>Configuration</h2>
    <label>Gist ID:</label>
    <input type="text" id="gist-id" value="7f9e078242e1515e41b2c3b2e4cca2a7">
    
    <label>GitHub Token:</label>
    <input type="password" id="token" value="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">

    <h2>Tests</h2>
    <button onclick="testRead()">1. Test Read (No Auth)</button>
    <button onclick="testTokenValidity()">2. Test Token Validity</button>
    <button onclick="testWrite()">3. Test Write to Gist</button>
    <button onclick="testFullFlow()">4. Test Full Registration Flow</button>

    <div id="output"></div>

    <script>
        function log(msg, type = 'info') {
            const output = document.getElementById('output');
            const div = document.createElement('div');
            div.className = 'output ' + type;
            div.textContent = new Date().toLocaleTimeString() + ' - ' + msg;
            output.appendChild(div);
        }

        function getGistId() { return document.getElementById('gist-id').value; }
        function getToken() { return document.getElementById('token').value; }

        async function testRead() {
            log('Testing Gist read (no authentication)...', 'info');
            try {
                const url = `https://gist.githubusercontent.com/AxioOG/${getGistId()}/raw/fuse-users.json?t=${Date.now()}`;
                log(`Fetching: ${url}`, 'info');
                
                const response = await fetch(url);
                log(`Response status: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
                
                if (response.ok) {
                    const data = await response.json();
                    log(`✓ Read successful! Users found: ${data.users ? data.users.length : 0}`, 'success');
                    log(`Data: ${JSON.stringify(data, null, 2)}`, 'info');
                } else {
                    const text = await response.text();
                    log(`✗ Read failed: ${text}`, 'error');
                }
            } catch (err) {
                log(`✗ Exception: ${err.message}`, 'error');
            }
        }

        async function testTokenValidity() {
            log('Testing GitHub token validity...', 'info');
            try {
                const response = await fetch('https://api.github.com/user', {
                    headers: {
                        'Authorization': `token ${getToken()}`
                    }
                });
                
                log(`Response status: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
                
                if (response.ok) {
                    const user = await response.json();
                    log(`✓ Token is valid! Authenticated as: ${user.login}`, 'success');
                    log(`User data: ${JSON.stringify(user, null, 2)}`, 'info');
                } else {
                    const error = await response.json();
                    log(`✗ Token is invalid: ${error.message}`, 'error');
                    log(`Full error: ${JSON.stringify(error, null, 2)}`, 'error');
                }
            } catch (err) {
                log(`✗ Exception: ${err.message}`, 'error');
            }
        }

        async function testWrite() {
            log('Testing Gist write...', 'info');
            try {
                // First read current data
                const readUrl = `https://gist.githubusercontent.com/AxioOG/${getGistId()}/raw/fuse-users.json?t=${Date.now()}`;
                const readResponse = await fetch(readUrl);
                let currentData = { users: [] };
                
                if (readResponse.ok) {
                    currentData = await readResponse.json();
                    log(`Current users in Gist: ${currentData.users.length}`, 'info');
                }

                // Add a test user
                const testUser = {
                    id: 'TEST_' + Date.now(),
                    username: 'test_user',
                    global_name: 'Test User',
                    avatar: null,
                    roles: [],
                    seenAt: Date.now()
                };
                currentData.users.push(testUser);
                log(`Adding test user: ${testUser.username}`, 'info');

                // Write to Gist
                const writeUrl = `https://api.github.com/gists/${getGistId()}`;
                log(`Writing to: ${writeUrl}`, 'info');
                
                const writeResponse = await fetch(writeUrl, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `token ${getToken()}`
                    },
                    body: JSON.stringify({
                        files: {
                            'fuse-users.json': {
                                content: JSON.stringify(currentData, null, 2)
                            }
                        }
                    })
                });

                log(`Response status: ${writeResponse.status} ${writeResponse.statusText}`, writeResponse.ok ? 'success' : 'error');

                if (writeResponse.ok) {
                    const result = await writeResponse.json();
                    log(`✓ Write successful!`, 'success');
                    log(`Gist URL: ${result.html_url}`, 'success');
                } else {
                    const error = await writeResponse.json();
                    log(`✗ Write failed: ${error.message}`, 'error');
                    log(`Full error: ${JSON.stringify(error, null, 2)}`, 'error');
                }
            } catch (err) {
                log(`✗ Exception: ${err.message}`, 'error');
            }
        }

        async function testFullFlow() {
            log('Testing full registration flow...', 'info');
            log('This simulates what happens when a user signs in', 'info');
            
            const mockUser = {
                id: '123456789012345678',
                username: 'testuser',
                global_name: 'Test User',
                avatar: 'abc123',
                discriminator: '0'
            };
            const mockRoles = ['1489330191498084413']; // Customer role

            log(`Mock user: ${mockUser.username} (${mockUser.id})`, 'info');
            log(`Mock roles: ${mockRoles.join(', ')}`, 'info');

            try {
                // Read current data
                const readUrl = `https://gist.githubusercontent.com/AxioOG/${getGistId()}/raw/fuse-users.json?t=${Date.now()}`;
                const readResponse = await fetch(readUrl);
                let data = { users: [] };
                
                if (readResponse.ok) {
                    data = await readResponse.json();
                    log(`✓ Read current data: ${data.users.length} users`, 'success');
                } else {
                    log(`⚠ Could not read current data, starting fresh`, 'info');
                }

                // Create entry
                const entry = {
                    id: mockUser.id,
                    username: mockUser.username,
                    global_name: mockUser.global_name || mockUser.username,
                    avatar: mockUser.avatar,
                    roles: mockRoles,
                    seenAt: Date.now()
                };

                // Update or add
                const idx = data.users.findIndex(u => u.id === entry.id);
                if (idx > -1) {
                    data.users[idx] = entry;
                    log(`Updating existing user at index ${idx}`, 'info');
                } else {
                    data.users.push(entry);
                    log(`Adding new user (total: ${data.users.length})`, 'info');
                }

                // Write back
                const writeUrl = `https://api.github.com/gists/${getGistId()}`;
                const writeResponse = await fetch(writeUrl, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `token ${getToken()}`
                    },
                    body: JSON.stringify({
                        files: {
                            'fuse-users.json': {
                                content: JSON.stringify(data, null, 2)
                            }
                        }
                    })
                });

                log(`Write response: ${writeResponse.status} ${writeResponse.statusText}`, writeResponse.ok ? 'success' : 'error');

                if (writeResponse.ok) {
                    log(`✓ Full flow completed successfully!`, 'success');
                    log(`User ${mockUser.username} should now appear in admin panel`, 'success');
                } else {
                    const error = await writeResponse.json();
                    log(`✗ Write failed: ${error.message}`, 'error');
                    log(`Full error: ${JSON.stringify(error, null, 2)}`, 'error');
                }
            } catch (err) {
                log(`✗ Exception: ${err.message}`, 'error');
                console.error(err);
            }
        }

        // Auto-run read test on load
        window.addEventListener('load', () => {
            log('Diagnostic tool loaded. Click buttons to run tests.', 'info');
            testRead();
        });
    </script>
</body>
</html>
