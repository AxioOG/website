<!DOCTYPE html>
<html>
<head>
<script>
    // Preserve both path and hash (needed for Discord OAuth token)
    const path = window.location.pathname;
    const hash = window.location.hash;
    window.location.replace('/?p=' + encodeURIComponent(path) + (hash ? '&h=' + encodeURIComponent(hash) : ''));
</script>
</head>
</html>
