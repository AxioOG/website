<!DOCTYPE html>
<html>
<head>
<script>
    var hash = window.location.hash;
    var path = window.location.pathname;
    // If there's a discord token in the hash, save it before redirecting
    if (hash && hash.indexOf('access_token') !== -1) {
        var p = new URLSearchParams(hash.substring(1));
        var t = p.get('access_token');
        if (t) localStorage.setItem('_dpt', t);
    }
    window.location.replace('/?p=' + encodeURIComponent(path));
</script>
</head>
</html>
